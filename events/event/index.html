<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Upcoming and past events from Creative Endeavors.">
<meta property="og:title" content="Events · Creative Endeavors">
<meta property="og:description" content="Creative Endeavors is an independent organization founded on the belief that creativity is fundamental to shaping the future of business, technology, and culture.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Creative Endeavors">
<meta property="og:url" content="https://creativeendeavors.xyz/events/event/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://creativeendeavors.xyz/events/event/">
<title>Event · Creative Endeavors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">
<style>
/* Layout: a white page. Name top-left, email top-right, what this is in the middle, the quote and copyright at the foot. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #6e6e6e;
  --sans: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.page {
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-block: 32px;
  padding-left: max(32px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
}
.name {
  margin: 0;
  font-weight: 500;
  font-size: 15px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
/* Email and dot on the right. The dot shows the site's sections. */
.nav { position: relative; display: flex; flex-direction: column; align-items: flex-end; }
.nav-row { display: flex; align-items: center; gap: 16px; min-height: 1.5em; white-space: nowrap; }
.dot {
  margin: -8px; padding: 8px; border: 0; background: none; cursor: pointer; line-height: 0;
}
.dot span {
  display: block; width: 10px; height: 10px; border-radius: 50%;
  border: 1px solid var(--fg); background: var(--fg); transition: background 0.15s ease, opacity 0.15s ease;
}
.dot[aria-expanded="true"] span { background: transparent; }
.dot:hover span { opacity: 0.6; }
.dot:focus-visible { outline: 1px solid var(--fg); outline-offset: -2px; border-radius: 50%; }
/* Computer: the list floats under the email, lined up with its right edge. */
.menu {
  position: absolute; top: 100%; right: 26px; z-index: 1;
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  margin-top: 8px; background: var(--bg); white-space: nowrap;
  animation: menu-in 0.2s ease;
}
.menu[hidden] { display: none; }
.menu .menu-email { display: none; }
@keyframes menu-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .menu { animation: none; } }
a {
  color: var(--fg);
  text-decoration: none;
  transition: color 0.15s ease;
}
a:hover, a:focus-visible { color: var(--muted); }
a:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }
main {
  align-self: center;
  justify-self: center;
  width: 100%;
  max-width: 34rem;
  padding-block: 96px;
}
.lede {
  margin: 0;
  font-family: inherit;
  font-size: 22px;
  font-weight: 500;
  line-height: 1.35;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.intro {
  margin: 16px 0 0;
  text-wrap: pretty;
}
footer {
  color: var(--muted);
  font-size: 13px;
}
footer p { margin: 0; }
footer .epigraph {
  max-width: 34rem;
  margin-bottom: 8px;
  font-style: italic;
  text-wrap: pretty;
}
/* Larger screens get larger middle text; the column grows with it to keep lines about 65-70 characters. */
@media (min-width: 768px) {
  main { max-width: 32rem; }
  .lede { font-size: 24px; }
  .intro { font-size: 16px; line-height: 1.55; }
}
@media (min-width: 1024px) {
  main { max-width: 34rem; }
  .lede { font-size: 28px; letter-spacing: -0.015em; }
  .intro { margin-top: 18px; font-size: 17px; }
  .lede + .intro { margin-top: 24px; }
  /* Header and footer step up too, staying a notch below the middle text. */
  .page {
    padding-block: 40px;
    padding-left: max(48px, env(safe-area-inset-left, 0px));
    padding-right: max(48px, env(safe-area-inset-right, 0px));
  }
  body, .name { font-size: 16px; }
  footer { font-size: 14px; }
  footer .epigraph { max-width: 40rem; }
}
@media (max-width: 639px) {
  .nav-email { display: none; }
  .menu { position: static; margin-top: 16px; gap: 6px; }
  .menu .menu-email { display: block; margin-top: 24px; color: var(--muted); }
}
@media (max-width: 480px) {
  .page {
    padding-block: 24px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  main { padding-block: 64px; }
  .lede { font-size: 20px; }
}
/* One event: when and where, the cover photo, the story, then the photos. */
main.event-page { align-self: start; max-width: 44rem; }
@media (min-width: 1024px) { main.event-page { max-width: 48rem; } }
.back { display: inline-block; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
.when { margin: 0 0 8px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.where { margin: 8px 0 0; color: var(--muted); }
/* The cover is shown exactly as uploaded: its own shape, never cropped, stretched or enlarged. */
.cover { display: block; width: auto; height: auto; max-width: 100%; margin: 32px 0 0; }
.summary { margin: 32px 0 0; font-size: 19px; line-height: 1.45; text-wrap: pretty; }
.story p { margin: 18px 0 0; text-wrap: pretty; }
.cta { display: inline-block; margin-top: 32px; padding: 12px 22px; background: var(--fg); color: var(--bg); border-radius: 6px; font-weight: 500; }
.cta:hover, .cta:focus-visible { color: var(--bg); opacity: 0.85; }
.photos-h { margin: 56px 0 0; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
@media (min-width: 768px) { .photos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.photos button { padding: 0; border: 0; background: #f3f3f3; cursor: zoom-in; border-radius: 3px; overflow: hidden; aspect-ratio: 1; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.15s; }
.photos button:hover img { opacity: 0.9; }
dialog.viewer { padding: 0; border: 0; background: transparent; max-width: 100vw; max-height: 100vh; }
dialog.viewer::backdrop { background: rgba(10, 10, 10, 0.92); }
dialog.viewer img { display: block; max-width: 94vw; max-height: 88vh; object-fit: contain; }
dialog.viewer .bar { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; color: #fff; font-size: 14px; }
dialog.viewer button { background: none; border: 0; color: #fff; cursor: pointer; font: inherit; padding: 4px 0; }
.missing { color: var(--muted); }
@media (min-width: 1024px) { .summary { font-size: 21px; } .story { font-size: 17px; line-height: 1.6; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="name"><a href="/">Creative Endeavors</a></p>
    <div class="nav">
      <div class="nav-row">
        <a class="nav-email" href="mailto:hello@creativeendeavors.xyz">hello@creativeendeavors.xyz</a>
        <button class="dot" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu"><span></span></button>
      </div>
      <nav class="menu" id="menu" aria-label="Sections" hidden>
        <a href="/events/">Events</a>
        <a href="/introductions/">Introductions</a>
        <a href="/partners/">Partners</a>
        <a href="/sign-in/">Sign in</a>
        <a class="menu-email" href="mailto:hello@creativeendeavors.xyz">hello@creativeendeavors.xyz</a>
      </nav>
    </div>
  </header>
  <main class="event-page" id="event">
    <a class="back" href="/events/">&larr; All events</a>
    <p class="missing" id="loading">Loading…</p>
  </main>
  <dialog class="viewer" id="viewer" aria-label="Photo">
    <img id="viewer-img" alt="">
    <div class="bar"><button type="button" id="prev">&larr; Previous</button><span id="viewer-count"></span><button type="button" id="next">Next &rarr;</button><button type="button" id="close">Close</button></div>
  </dialog>
  <footer>
    <p class="epigraph" data-content="home.epigraph">&ldquo;I can either spend my time designing the candle or I can spend my time designing the room that it sits in.&rdquo; &mdash;&nbsp;Virgil&nbsp;Abloh</p>
    <p>&copy; 2026 Creative Endeavors</p>
  </footer>
</div>
<script>
(function () {
  var dot = document.querySelector(".dot");
  var menu = document.getElementById("menu");
  var nav = document.querySelector(".nav");
  function set(open) {
    menu.hidden = !open;
    dot.setAttribute("aria-expanded", String(open));
    dot.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }
  dot.addEventListener("click", function () { set(menu.hidden); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !menu.hidden) { set(false); dot.focus(); } });
  document.addEventListener("click", function (e) { if (!menu.hidden && !nav.contains(e.target)) set(false); });
})();
</script>
<script src="/assets/ce.js?v=2"></script>
<script>
/* One published event, by its address (?e=slug): the write-up and photos
   added in /manage/. */
(function () {
  var main = document.getElementById("event");
  var slug = new URLSearchParams(location.search).get("e") || "";
  var dateOpts = { weekday: "long", month: "long", day: "numeric", year: "numeric" };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function isPast(e) { var end = e.ends_at ? new Date(e.ends_at) : new Date(new Date(e.starts_at).setHours(23, 59, 59, 999)); return end < new Date(); }
  function when(e) {
    var d = new Date(e.starts_at);
    var s = d.toLocaleDateString("en-US", dateOpts) + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    if (e.ends_at) {
      var end = new Date(e.ends_at);
      s += end.toDateString() === d.toDateString() ? "–" + end.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : " – " + end.toLocaleDateString("en-US", dateOpts);
    }
    return s;
  }
  function missing(text) { document.getElementById("loading").textContent = text; }
  function show(e) {
    document.getElementById("loading").remove();
    document.title = e.title + " · Creative Endeavors";
    var past = isPast(e);
    main.appendChild(el("p", "when", when(e)));
    main.appendChild(el("h1", "lede", e.title));
    var where = [e.venue, e.city].filter(Boolean).join(", ");
    if (where) main.appendChild(el("p", "where", where));
    if (e.cover_url) { var c = el("img", "cover"); c.src = e.cover_url; c.alt = ""; main.appendChild(c); }
    if (e.description) main.appendChild(el("p", "summary", e.description));
    if (e.story) {
      var story = el("div", "story");
      e.story.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean).forEach(function (p) { story.appendChild(el("p", "", p)); });
      main.appendChild(story);
    }
    if (e.link && /^https?:\/\//i.test(e.link)) {
      var a = el("a", "cta", past ? "Learn more" : "RSVP"); a.href = e.link; a.rel = "noopener"; main.appendChild(a);
    }
    var photos = (e.photos || []).filter(function (u) { return /^https?:\/\//i.test(u); });
    if (photos.length) {
      main.appendChild(el("h2", "photos-h", "Photos"));
      var grid = el("div", "photos");
      photos.forEach(function (u, i) {
        var b = el("button", ""); b.type = "button"; b.setAttribute("aria-label", "Open photo " + (i + 1) + " of " + photos.length);
        var img = el("img", ""); img.src = u; img.alt = ""; img.loading = "lazy"; b.appendChild(img);
        b.addEventListener("click", function () { open(i); });
        grid.appendChild(b);
      });
      main.appendChild(grid);
    }
    // Full-screen photo viewer, with arrow keys.
    var viewer = document.getElementById("viewer"), vimg = document.getElementById("viewer-img"), at = 0;
    function open(i) { at = (i + photos.length) % photos.length; vimg.src = photos[at]; document.getElementById("viewer-count").textContent = (at + 1) + " / " + photos.length; if (!viewer.open) viewer.showModal(); }
    document.getElementById("prev").onclick = function () { open(at - 1); };
    document.getElementById("next").onclick = function () { open(at + 1); };
    document.getElementById("close").onclick = function () { viewer.close(); };
    viewer.addEventListener("click", function (ev) { if (ev.target === viewer) viewer.close(); });
    document.addEventListener("keydown", function (ev) { if (!viewer.open) return; if (ev.key === "ArrowLeft") open(at - 1); if (ev.key === "ArrowRight") open(at + 1); });
  }
  if (!slug) return missing("This event isn’t available.");
  CE.get("ce_events?select=slug,title,starts_at,ends_at,venue,city,description,story,link,cover_url,photos&published=is.true&slug=eq." + encodeURIComponent(slug) + "&limit=1")
    .then(function (rows) { if (rows[0]) show(rows[0]); else missing("This event isn’t available. It may have been moved or taken down."); })
    .catch(function () { missing("This event couldn’t be loaded. Please try again shortly."); });
  CE.applyContent();
})();
</script>
</body>
</html>

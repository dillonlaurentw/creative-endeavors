<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Manage · Creative Endeavors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">
<style>
/* Manage: the admin side of the site. Same white page and type as the public
   pages; a list on the left and the thing being edited on the right. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #6e6e6e;
  --line: #e6e6e6;
  --field: #d4d4d4;
  --soft: #f6f6f6;
  --error: #b00020;
  --ok: #1a7f37;
  --sans: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--fg); }
a:hover { color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
[hidden] { display: none !important; }

.page { padding: 32px max(32px, env(safe-area-inset-left, 0px)) 64px max(32px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; }
header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.brand { margin: 0; font-weight: 500; font-size: 15px; }
.brand a { text-decoration: none; }
.brand span { color: var(--muted); font-weight: 400; }
.who { display: flex; gap: 16px; align-items: baseline; color: var(--muted); font-size: 14px; min-width: 0; }
.who .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }

nav.tabs { display: flex; gap: 4px 24px; flex-wrap: wrap; margin: 40px 0 0; border-bottom: 1px solid var(--line); }
nav.tabs a { text-decoration: none; padding: 0 0 12px; margin-bottom: -1px; color: var(--muted); border-bottom: 1px solid transparent; }
nav.tabs a:hover { color: var(--fg); }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }

.status { min-height: 1.5em; margin: 16px 0 0; font-size: 14px; color: var(--muted); }
.status.error { color: var(--error); }
.status.ok { color: var(--ok); }

.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; margin-top: 16px; }
@media (min-width: 900px) { .split { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 48px; } }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type="search"] { flex: 1 1 160px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.chip { border: 1px solid var(--field); background: var(--bg); border-radius: 999px; padding: 2px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.list { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid var(--line); }
.list li { border-bottom: 1px solid var(--line); }
.list .row { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 8px; cursor: pointer; text-decoration: none; }
.list .row:hover { background: var(--soft); color: var(--fg); }
.list .row[aria-current="true"] { background: var(--soft); box-shadow: inset 2px 0 0 var(--fg); }
.row .t { display: block; font-weight: 500; }
.row .s { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.badge { display: inline-block; margin-left: 8px; padding: 0 6px; border: 1px solid var(--field); border-radius: 4px; font-size: 11px; font-weight: 400; color: var(--muted); vertical-align: 2px; letter-spacing: 0.02em; }
.count { margin-top: 12px; color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 16px 0; }

.panel h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; }
.panel h3 { margin: 40px 0 0; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.panel .hint { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.panel .blank { color: var(--muted); padding-top: 8px; }

form.fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 24px; }
@media (min-width: 640px) { form.fields { grid-template-columns: 1fr 1fr; } .field.wide { grid-column: 1 / -1; } }
.field label, .field .label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.field .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
input[type="text"], input[type="email"], input[type="tel"], input[type="url"], input[type="search"], input[type="password"], input[type="datetime-local"], input[type="number"], select, textarea {
  width: 100%; border: 1px solid var(--field); border-radius: 6px; padding: 8px 10px; background: var(--bg); min-height: 40px;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--fg); }
.check { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.check input { width: 18px; height: 18px; accent-color: var(--fg); }
.actions { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); border-radius: 6px; padding: 8px 16px; cursor: pointer; min-height: 40px; white-space: nowrap; }
.btn:hover { opacity: 0.85; color: var(--bg); }
.btn.ghost:hover { color: var(--fg); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.ghost { background: var(--bg); color: var(--fg); border-color: var(--field); }
.btn.ghost:hover { border-color: var(--fg); opacity: 1; }
.btn.small { min-height: 32px; padding: 4px 12px; font-size: 14px; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.link:hover { color: var(--muted); }
.link.danger { color: var(--error); }
.spacer { flex: 1; }

.items { list-style: none; margin: 12px 0 0; padding: 0; }
.items li { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.items li:first-child { border-top: 1px solid var(--line); }
.items .main { min-width: 0; flex: 1 1 200px; }
.items .main .s { display: block; color: var(--muted); font-size: 13px; }
.items .side { display: flex; gap: 12px; align-items: baseline; }
.adder { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 12px; }
@media (min-width: 640px) { .adder { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; align-items: end; } .adder.four { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 2fr) auto; } }

.stats { display: flex; gap: 32px; flex-wrap: wrap; margin-top: 24px; }
.stat .n { font-size: 28px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 13px; }

.gate { max-width: 24rem; margin: 15vh auto 0; }
.gate h1 { margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -0.015em; }
.gate p { color: var(--muted); }
.gate form { display: grid; gap: 12px; margin-top: 24px; }

.content-item { padding: 24px 0; border-bottom: 1px solid var(--line); }
.content-item:first-of-type { border-top: 1px solid var(--line); margin-top: 16px; }
.content-item .k { font-size: 13px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.content-item .name { font-weight: 500; }
.content-item .row2 { display: flex; gap: 12px; align-items: center; margin-top: 8px; flex-wrap: wrap; }

@media (max-width: 480px) {
  .page { padding: 24px max(16px, env(safe-area-inset-left, 0px)) 48px max(16px, env(safe-area-inset-right, 0px)); }
  .who .email { display: none; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <p class="brand"><a href="/">Creative Endeavors</a> <span>· Manage</span></p>
    <div class="who" id="who" hidden><span class="email" id="who-email"></span><button class="link" id="sign-out" type="button">Sign out</button></div>
  </header>

  <section class="gate" id="gate">
    <h1 id="gate-title">Manage.</h1>
    <p id="gate-text">Checking who you are…</p>
    <form id="sign-in" hidden>
      <div class="field"><label for="si-email">Email</label><input id="si-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="si-password">Password</label><input id="si-password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Sign in</button>
      <p class="status" id="si-status" role="status"></p>
      <p class="hint">Forgot your password? Reset it on the <a href="/sign-in/">sign-in page</a>.</p>
    </form>
  </section>

  <div id="app" hidden>
    <nav class="tabs" aria-label="Manage">
      <a href="#events" data-tab="events">Events</a>
      <a href="#people" data-tab="people">People</a>
      <a href="#connections" data-tab="connections">Connections</a>
      <a href="#partners" data-tab="partners">Partners</a>
      <a href="#content" data-tab="content">Site text</a>
      <a href="#admins" data-tab="admins">Admins</a>
    </nav>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <main id="view"></main>
  </div>
</div>

<datalist id="dl-people"></datalist>
<datalist id="dl-events"></datalist>
<datalist id="dl-kinds"><option value="Dinner"><option value="Salon"><option value="Workshop"><option value="Talk"><option value="Studio visit"><option value="Opening"><option value="Meetup"><option value="Screening"><option value="Performance"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/ce.js"></script>
<script src="/manage/manage.js"></script>
</body>
</html>
